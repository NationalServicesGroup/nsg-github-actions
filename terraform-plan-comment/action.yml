name: "Comment Terraform Plan on PR"
description: "Formats terraform plan output (changes only) and comments on PR (updates existing comment)"

inputs:
  plan_file:
    description: "Path to the plan output text file"
    required: true
  working_directory:
    description: "Working directory for Terraform"
    required: false
    default: "."
  github_token:
    description: "GitHub token for commenting"
    required: true

runs:
  using: "composite"
  steps:
    - name: Format Plan Output
      id: format-plan
      shell: bash
      run: |
        # Strip refreshing/reading noise, keep only the changes
        PLAN_CHANGES=$(sed -n '/Terraform used the selected providers/,$ p' "${{ inputs.plan_file }}")

        if [ -z "$PLAN_CHANGES" ]; then
          PLAN_CHANGES=$(sed -n '/Terraform will perform the following actions/,$ p' "${{ inputs.plan_file }}")
        fi

        if [ -z "$PLAN_CHANGES" ]; then
          PLAN_CHANGES=$(grep -E '(No changes|Plan:|Error|Warning)' "${{ inputs.plan_file }}" || true)
        fi

        if [ -z "$PLAN_CHANGES" ]; then
          PLAN_CHANGES=$(grep -v -E '(Refreshing state\.\.\.|: Reading\.\.\.|: Read complete after)' "${{ inputs.plan_file }}" || true)
        fi

        # Truncate if needed (leave room for markdown wrapper in PR comment)
        MAX_LENGTH=55000
        if [ ${#PLAN_CHANGES} -gt $MAX_LENGTH ]; then
          PLAN_CHANGES="${PLAN_CHANGES:0:$MAX_LENGTH}"
          PLAN_CHANGES="${PLAN_CHANGES}

... (truncated — view full plan in workflow logs)"
        fi

        echo "$PLAN_CHANGES" > formatted_plan.txt

        # Step summary
        echo "## Terraform Plan" >> $GITHUB_STEP_SUMMARY
        echo '```hcl' >> $GITHUB_STEP_SUMMARY
        cat formatted_plan.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Comment PR with Plan
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('formatted_plan.txt', 'utf8');

          if (context.eventName !== 'pull_request') {
            console.log('Not a pull request, skipping comment');
            return;
          }

          const commitSha = context.payload.pull_request.head.sha;
          const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}/commits/${commitSha}`;
          const body = `## Terraform Plan\n\nCommit: [\`${commitSha.substring(0, 7)}\`](${commitUrl})\n\n<details>\n<summary>Show Plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;

          const comments = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const existingComment = comments.data.find(comment =>
            comment.body.includes('## Terraform Plan')
          );

          if (existingComment) {
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            console.log('Updated existing comment');
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            console.log('Created new comment');
          }
