name: Terraform GCP K8s Environment
run-name: Terraform K8s ${{ inputs.environment }} - Plan and Apply

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to manage (e.g., stage, hgeprod, prod)"
        required: true
        type: string
      working_directory:
        description: "Working directory for Terraform"
        required: false
        type: string
        default: "terraform"
      tf_version:
        description: "Terraform version"
        required: false
        type: string
        default: "1.12.0"
      tfvars_directory:
        description: "Directory containing tfvars files (relative to working_directory)"
        required: false
        type: string
        default: "variables"
      approvers:
        description: "Comma-separated list of GitHub usernames who can approve"
        required: true
        type: string
      minimum_approvals:
        description: "Minimum number of approvals required"
        required: false
        type: number
        default: 1
      approval_timeout_minutes:
        description: "Timeout for approval in minutes"
        required: false
        type: number
        default: 2400
      tailscale_ping_host:
        description: "Host to ping after Tailscale connection (for verification)"
        required: false
        type: string
        default: ""
    secrets:
      gcp_service_account_key:
        description: "GCP service account key JSON"
        required: true
      pat_token:
        description: "GitHub PAT token for PR comments and approval issues"
        required: true
      ts_oauth_client_id:
        description: "Tailscale OAuth client ID"
        required: true
      ts_oauth_secret:
        description: "Tailscale OAuth secret"
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  terraform-plan:
    name: Plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: NationalServicesGroup/nsg-github-actions/install-terraform@main
        with:
          tf_version: ${{ inputs.tf_version }}

      - name: Determine Project ID and Cluster Info
        id: project
        working-directory: ${{ inputs.working_directory }}
        run: |
          TFVARS_FILE="${{ inputs.tfvars_directory }}/${{ inputs.environment }}.tfvars"
          if [ -f "$TFVARS_FILE" ]; then
            PROJECT_ID=$(grep -E '^project_id\s*=' "$TFVARS_FILE" | sed -E 's/.*=\s*"([^"]+)".*/\1/')
            CLUSTER_NAME=$(grep -E '^cluster_name\s*=' "$TFVARS_FILE" | sed -E 's/.*=\s*"([^"]+)".*/\1/')
            REGION=$(grep -E '^region\s*=' "$TFVARS_FILE" | sed -E 's/.*=\s*"([^"]+)".*/\1/')
            echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
            echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
            echo "region=$REGION" >> $GITHUB_OUTPUT
            echo "Found project_id: $PROJECT_ID, cluster_name: $CLUSTER_NAME, region: $REGION"
          else
            echo "Error: $TFVARS_FILE not found"
            exit 1
          fi

      - name: GCP Authentication
        uses: NationalServicesGroup/nsg-github-actions/gcp-auth@main
        with:
          gcp_service_account_key: ${{ secrets.gcp_service_account_key }}
          project_id: ${{ steps.project.outputs.project_id }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          oauth-secret: ${{ secrets.ts_oauth_secret }}
          tags: tag:cicd

      - name: Configure Tailscale for Subnet Routing
        run: |
          # Enable accept-routes
          sudo tailscale set --accept-routes=true

          # Wait for Tailscale to fully initialize and routes to propagate
          echo "Waiting for Tailscale routes to be ready..."
          for i in {1..30}; do
            if ip route show table 52 2>/dev/null | grep -q "dev tailscale0"; then
              echo "✅ Tailscale routes ready after ${i} seconds"
              break
            fi
            echo "Waiting for routes... ($i/30)"
            sleep 1
          done

          # Debug info
          echo ""
          echo "=== Tailscale Status ==="
          tailscale status

          echo ""
          echo "=== Tailscale IP Info ==="
          tailscale ip -4

          echo ""
          echo "=== IP Routes (table 52 - Tailscale) ==="
          ip route show table 52 2>/dev/null || echo "Table 52 not found yet"

          echo ""
          echo "=== IP Routes (main) ==="
          ip route | head -20

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE Credentials
        id: gke-creds
        run: |
          # Get credentials (uses public endpoint by default)
          gcloud container clusters get-credentials ${{ steps.project.outputs.cluster_name }} \
            --region ${{ steps.project.outputs.region }} \
            --project ${{ steps.project.outputs.project_id }}

          echo "Kubeconfig configured for: ${{ steps.project.outputs.cluster_name }}"

          # Extract the endpoint from kubeconfig
          ENDPOINT=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' | sed 's|https://||')
          echo "GKE Endpoint: $ENDPOINT"
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

      - name: Test Kubectl Connection
        run: |
          echo "Testing kubectl connection via Tailscale..."
          ENDPOINT="${{ steps.gke-creds.outputs.endpoint }}"

          # Verify route exists for the endpoint
          echo "Checking route for $ENDPOINT..."
          for i in {1..10}; do
            if ip route show table 52 2>/dev/null | grep -q "$ENDPOINT"; then
              echo "✅ Route for $ENDPOINT found in table 52"
              break
            fi
            echo "Waiting for route to $ENDPOINT... ($i/10)"
            sleep 2
          done

          echo ""
          echo "Routes in Tailscale table 52 (34.x.x.x):"
          ip route show table 52 2>/dev/null | grep -E "^34\." || echo "No 34.x.x.x routes found"

          # Test kubectl with retries
          echo ""
          echo "Testing kubectl cluster-info..."
          for attempt in {1..3}; do
            if timeout 30 kubectl cluster-info; then
              echo ""
              echo "✅ Successfully connected to GKE cluster via Tailscale!"
              kubectl get nodes --no-headers | head -3
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 5 seconds..."
            sleep 5
          done

          echo "❌ kubectl cluster-info failed after 3 attempts"
          echo ""
          echo "Debug: Testing tailscale nc to $ENDPOINT:443..."
          timeout 5 tailscale nc "$ENDPOINT" 443 </dev/null && echo "tailscale nc succeeded" || echo "tailscale nc failed"
          exit 1

      - name: Initialize Terraform
        working-directory: ${{ inputs.working_directory }}
        run: |
          # Use existing init script if available, otherwise do manual init
          if [ -f "scripts/terraform_init.sh" ]; then
            chmod +x scripts/terraform_init.sh
            ./scripts/terraform_init.sh ${{ inputs.environment }}
          else
            # Fallback: manual init
            if [ -f "backends/backend.${{ inputs.environment }}.tf" ]; then
              cp backends/backend.${{ inputs.environment }}.tf backend.tf
            fi
            if [ -f "variables/${{ inputs.environment }}.tfvars" ]; then
              cp variables/${{ inputs.environment }}.tfvars terraform.tfvars
            fi
            terraform init
          fi

      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.working_directory }}
        run: |
          # Run plan and capture output
          set +e
          terraform plan \
            -var-file="${{ inputs.tfvars_directory }}/${{ inputs.environment }}.tfvars" \
            -detailed-exitcode -no-color -out=tfplan 2>&1 | tee plan_output.txt
          exitcode=$?
          set -e

          # Exit code 0 = no changes, 1 = error, 2 = changes
          if [ $exitcode -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1
          elif [ $exitcode -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.pat_token }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ inputs.working_directory }}/plan_output.txt', 'utf8');
            const maxLength = 65000;
            let truncatedPlan = plan;

            if (plan.length > maxLength) {
              truncatedPlan = plan.substring(0, maxLength) + '\n\n... (truncated)';
            }

            const output = `### Terraform Plan (K8s): \`${{ inputs.environment }}\`

            <details>
            <summary>Show Plan</summary>

            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Upload Plan Artifacts
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-k8s-${{ inputs.environment }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/plan_output.txt
          retention-days: 1

      - name: Logout Tailscale
        if: always()
        run: tailscale logout

  manual-approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: ${{ inputs.approval_timeout_minutes }}

    steps:
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-k8s-${{ inputs.environment }}
          path: plan/

      - name: Format Plan for Approval
        id: format-plan
        uses: NationalServicesGroup/nsg-github-actions/terraform-format-plan@main
        with:
          plan_file: plan/plan_output.txt

      - name: Request Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.pat_token }}
          approvers: ${{ inputs.approvers }}
          minimum-approvals: ${{ inputs.minimum_approvals }}
          issue-title: "🚀 Terraform K8s Apply Approval - ${{ inputs.environment }} - ${{ github.repository }}"
          issue-body: |
            ## Terraform K8s Apply Approval Required

            **Environment:** `${{ inputs.environment }}`
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Workflow:** ${{ github.workflow }}
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Proposed Changes

            ```terraform
            ${{ steps.format-plan.outputs.plan_formatted }}
            ```

            ---

            **Approve this issue** to proceed with `terraform apply` for **${{ inputs.environment }}** K8s infrastructure.
          exclude-workflow-initiator-as-approver: false

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-plan, manual-approval]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: NationalServicesGroup/nsg-github-actions/install-terraform@main
        with:
          tf_version: ${{ inputs.tf_version }}

      - name: Determine Project ID and Cluster Info
        id: project
        working-directory: ${{ inputs.working_directory }}
        run: |
          TFVARS_FILE="${{ inputs.tfvars_directory }}/${{ inputs.environment }}.tfvars"
          if [ -f "$TFVARS_FILE" ]; then
            PROJECT_ID=$(grep -E '^project_id\s*=' "$TFVARS_FILE" | sed -E 's/.*=\s*"([^"]+)".*/\1/')
            CLUSTER_NAME=$(grep -E '^cluster_name\s*=' "$TFVARS_FILE" | sed -E 's/.*=\s*"([^"]+)".*/\1/')
            REGION=$(grep -E '^region\s*=' "$TFVARS_FILE" | sed -E 's/.*=\s*"([^"]+)".*/\1/')
            echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
            echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
            echo "region=$REGION" >> $GITHUB_OUTPUT
          else
            echo "Error: $TFVARS_FILE not found"
            exit 1
          fi

      - name: GCP Authentication
        uses: NationalServicesGroup/nsg-github-actions/gcp-auth@main
        with:
          gcp_service_account_key: ${{ secrets.gcp_service_account_key }}
          project_id: ${{ steps.project.outputs.project_id }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          oauth-secret: ${{ secrets.ts_oauth_secret }}
          tags: tag:cicd

      - name: Configure Tailscale for Subnet Routing
        run: |
          sudo tailscale set --accept-routes=true
          sleep 5
          echo "=== Tailscale Status ==="
          tailscale status

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE Credentials
        id: gke-creds
        run: |
          # Get credentials (uses public endpoint by default)
          gcloud container clusters get-credentials ${{ steps.project.outputs.cluster_name }} \
            --region ${{ steps.project.outputs.region }} \
            --project ${{ steps.project.outputs.project_id }}

          echo "Kubeconfig configured for: ${{ steps.project.outputs.cluster_name }}"

      - name: Test Kubectl Connection
        run: |
          timeout 30 kubectl cluster-info || {
            echo "❌ kubectl connection failed"
            exit 1
          }
          echo "✅ Connected to GKE cluster via Tailscale"

      - name: Initialize Terraform
        working-directory: ${{ inputs.working_directory }}
        run: |
          # Use existing init script if available, otherwise do manual init
          if [ -f "scripts/terraform_init.sh" ]; then
            chmod +x scripts/terraform_init.sh
            ./scripts/terraform_init.sh ${{ inputs.environment }}
          else
            # Fallback: manual init
            if [ -f "backends/backend.${{ inputs.environment }}.tf" ]; then
              cp backends/backend.${{ inputs.environment }}.tf backend.tf
            fi
            if [ -f "variables/${{ inputs.environment }}.tfvars" ]; then
              cp variables/${{ inputs.environment }}.tfvars terraform.tfvars
            fi
            terraform init
          fi

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-k8s-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}

      - name: Terraform Apply
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform apply -auto-approve tfplan
          echo "✅ Successfully applied K8s infrastructure changes to ${{ inputs.environment }}"

      - name: Logout Tailscale
        if: always()
        run: tailscale logout
