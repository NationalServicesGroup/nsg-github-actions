name: Sync All Repos from Bitbucket
run-name: Sync All Bitbucket Repos

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Add your repos here - one job per repo
  sync-gcp-app-infra:
    uses: NationalServicesGroup/nsg-github-actions/.github/workflows/mirror-from-bitbucket.yaml@main
    with:
      bitbucket_workspace: "your-workspace"
      bitbucket_repo: "gcp-app-infra"
      github_repo: "gcp-app-infra"
      default_branch: "main"
      sync_all_branches: false
    secrets:
      bitbucket_username: ${{ secrets.BITBUCKET_USERNAME }}
      bitbucket_app_password: ${{ secrets.BITBUCKET_APP_PASSWORD }}
      github_token: ${{ secrets.PAT_TOKEN }}

  # Example: Another repo
  # sync-another-repo:
  #   uses: NationalServicesGroup/nsg-github-actions/.github/workflows/mirror-from-bitbucket.yaml@main
  #   with:
  #     bitbucket_workspace: "your-workspace"
  #     bitbucket_repo: "another-repo"
  #   secrets:
  #     bitbucket_username: ${{ secrets.BITBUCKET_USERNAME }}
  #     bitbucket_app_password: ${{ secrets.BITBUCKET_APP_PASSWORD }}
  #     github_token: ${{ secrets.PAT_TOKEN }}
