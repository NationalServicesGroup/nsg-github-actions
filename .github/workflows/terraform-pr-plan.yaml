name: Terraform PR Plan
run-name: Terraform Plan for Pull Request

on:
  workflow_call:
    inputs:
      environments:
        description: "JSON array of environments to plan (e.g., ['stage', 'hgeprod'])"
        required: false
        type: string
        default: '["stage"]'
      working_directory:
        description: "Working directory for Terraform"
        required: false
        type: string
        default: "."
      tf_version:
        description: "Terraform version"
        required: false
        type: string
        default: "1.12.0"
    secrets:
      gcp_service_account_key:
        required: true
      project_id:
        required: true

jobs:
  setup:
    name: Setup Plan Jobs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          echo "matrix={\"environment\":${{ inputs.environments }}}" >> $GITHUB_OUTPUT

  plan:
    name: Plan ${{ matrix.environment }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: NationalServicesGroup/nsg-github-actions/install-terraform@main
        with:
          tf_version: ${{ inputs.tf_version }}

      - name: GCP Authentication
        uses: NationalServicesGroup/nsg-github-actions/gcp-auth@main
        with:
          gcp_service_account_key: ${{ secrets.gcp_service_account_key }}
          project_id: ${{ secrets.project_id }}

      - name: Initialize Terraform
        uses: NationalServicesGroup/nsg-github-actions/terraform-init@main
        with:
          environment: ${{ matrix.environment }}
          working_directory: ${{ inputs.working_directory }}

      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Strip plan noise
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          PLAN_CHANGES=$(sed -n '/Terraform used the selected providers/,$ p' plan.txt)
          if [ -z "$PLAN_CHANGES" ]; then
            PLAN_CHANGES=$(sed -n '/Terraform will perform the following actions/,$ p' plan.txt)
          fi
          if [ -z "$PLAN_CHANGES" ]; then
            PLAN_CHANGES=$(grep -E '(No changes|Plan:|Error|Warning)' plan.txt || true)
          fi
          if [ -z "$PLAN_CHANGES" ]; then
            PLAN_CHANGES=$(grep -v -E '(Refreshing state\.\.\.|: Reading\.\.\.|: Read complete after)' plan.txt || true)
          fi
          echo "$PLAN_CHANGES" > plan_cleaned.txt

      - name: Comment PR with Plan
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        env:
          WORK_DIR: ${{ inputs.working_directory }}
          ENVIRONMENT: ${{ matrix.environment }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.WORK_DIR}/plan_cleaned.txt`, 'utf8');
            const maxLength = 55000;
            let displayPlan = plan;

            if (plan.length > maxLength) {
              displayPlan = plan.substring(0, maxLength) + '\n\n... (truncated — view full plan in workflow logs)';
            }

            const body = [
              `### Terraform Plan: \`${process.env.ENVIRONMENT}\``,
              '',
              '<details>',
              '<summary>Show Plan</summary>',
              '',
              '```hcl',
              displayPlan,
              '```',
              '',
              '</details>',
              '',
              `*Pushed by: @${process.env.ACTOR}, Action: \`${process.env.EVENT_NAME}\`*`
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
